[project]
name = "bilibili-article"
version = "0.1.0"
description = "Make bilibili articles with ease."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"
