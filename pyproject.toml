[project]
name = "article-publisher"
version = "0.1.0"
description = "Multi-platform article publishing tool."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "aiohttp>=3.14.1",
    "json5>=0.14.0",
    "loguru>=0.7.3",
    "mistune>=3.2.1",
    "pillow>=12.2.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[project.scripts]
article-publisher = "article_publisher.__main__:main"
