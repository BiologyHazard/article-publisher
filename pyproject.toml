[project]
name = "article-publisher"
version = "0.1.0"
description = "Multi-platform article publishing tool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "json5>=0.14.0",
    "loguru>=0.7.3",
    "mistune>=3.2.1",
    "pillow>=12.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"
